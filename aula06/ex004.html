<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font: normal 20px Arial;
            background-color: rgba(42, 198, 250, 0.568);
        }
    </style>
</head>
<body>
    <script>
        var nome = window.prompt("Qual é o seu nome?");
        document.write(`ola ${nome}, seu nome tem ${nome.length} letras <br>`);
        document.write(`seu nome em maiusculas é ${nome.toUpperCase()} <br>`);
        document.write(`seu nome em minusculas é ${nome.toLowerCase()}`);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>meu site</title>
    <style>
        body {
            background-color: rgba(42, 198, 250, 0.568);
        }
        h1 {
            font-size: 100px;
            color: white;
            text-align: center;

        }
        p {
            font-size: 30px;
            color: white;
            text-align: center;
        }
      
    </style>
</head>
<body>
    <h1>ola mundo</h1>
    <p>este é o meu primeiro parágrafo</p>
    

    <script>
       var n1 = Number(window.prompt("Digite um número:"));
       var n2 = Number(window.prompt("Digite outro número:"));
       var operacao = window.prompt("Digite a operação que deseja realizar: +, -, *, /");
       var resultado;
       if (operacao === "+") {
           resultado = n1 + n2;
       } else if (operacao === "-") {
           resultado = n1 - n2;
       } else if (operacao === "*") {
           resultado = n1 * n2;
       } else if (operacao === "/") {
           resultado = n1 / n2;
       } else {
           window.alert("Operação inválida!");
       }
       window.alert(`O resultado da operação (${operacao}) entre ${n1} e ${n2} é: ${resultado}`);
    </script>
</body>
</html>

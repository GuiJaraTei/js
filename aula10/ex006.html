<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
    <style>
        div#area {
            font: normal 20pt Arial;
            background-color: #7fde6d;
            color: #fff;
            width: 200px;
            height: 200px;
            line-height: 200px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="area">
        interaja...
    </div>

    <script>
        var a = document.getElementById('area');
        a.addEventListener('click', clicou);
        a.addEventListener('mouseenter', entrar);
        a.addEventListener('mouseleave', sair);
        function clicou() {
            a.innerText = 'clicou...';
            a.style.backgroundColor = 'red';
        }
        function entrar() {
            a.innerText = 'entrou...';
        }
        function sair() {
            a.innerText = 'saiu...';
            a.style.backgroundColor = '#7fde6d';
        }
    </script>
</body>
</html>

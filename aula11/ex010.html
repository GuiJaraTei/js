<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DETRAN</title>
</head>
<body>
    <h1>Sistema de Multa</h1>
    Velocidade do carro:<input type="number" id="vel"> km/h
    <input type="button" value="Verificar" onclick="calcular()">
    <div id="res">

    </div>
    <script>
        
        function calcular(){
            var txtv = document.querySelector("input#vel")
            var res = document.querySelector('div#res')
            var velo = Number(txtv.value)
            res.innerHTML = `<p>sua velociade atual é <strong>${velo} km/h</strong></p>`
            if (velo > 60){
                res.innerHTML += `<p>voce esta sendo <strong>MULTADO</strong> por excesso de velocidade</p>`
            }
            res.innerHTML += '<p>Dirija sempre com o cinto de segurança!</p>'
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAISES</title>
</head>
<body>
    <h1>Sistema de Paises</h1>
    Qual Pais você vive?
    <input type="text" id="paises">
    <input type="button" value="Verificar" onclick="veri()">
    <div id="res"></div>

    <script>
        function veri(){
            var pais = document.querySelector('input#paises').value
            var res = document.querySelector('div#res')
            
            if (pais == 'Brasil'){
              res.innerHTML = 'voce é Brasileiro'

            }else{
              res.innerHTML = 'voce é Estrangeiro'
            }
}
    </script>
</body>
</html>
